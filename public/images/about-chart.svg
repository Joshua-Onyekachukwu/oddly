<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" rx="20" fill="#f0f9ff"/>
  <!-- Background pattern -->
  <circle cx="500" cy="100" r="80" fill="#e0f2fe" opacity="0.5"/>
  <circle cx="100" cy="350" r="60" fill="#fde68a" opacity="0.3"/>
  <!-- Main chart area -->
  <rect x="50" y="80" width="500" height="280" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Title -->
  <text x="75" y="115" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Prediction Accuracy Over Time</text>
  <!-- Grid lines -->
  <line x1="75" y1="150" x2="525" y2="150" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="75" y1="190" x2="525" y2="190" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="75" y1="230" x2="525" y2="230" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="75" y1="270" x2="525" y2="270" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="75" y1="310" x2="525" y2="310" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Y-axis labels -->
  <text x="60" y="154" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">100%</text>
  <text x="60" y="194" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">90%</text>
  <text x="60" y="234" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">80%</text>
  <text x="60" y="274" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">70%</text>
  <text x="60" y="314" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">60%</text>
  <!-- X-axis labels -->
  <text x="95" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Jan</text>
  <text x="175" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mar</text>
  <text x="255" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">May</text>
  <text x="335" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Jul</text>
  <text x="415" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Sep</text>
  <text x="495" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Nov</text>
  <!-- Area fill -->
  <path d="M95,290 L135,275 L175,260 L215,245 L255,220 L295,205 L335,190 L375,175 L415,165 L455,155 L495,148 L515,145 L515,315 L95,315 Z" fill="url(#grad1)" opacity="0.3"/>
  <!-- Line chart -->
  <polyline points="95,290 135,275 175,260 215,245 255,220 295,205 335,190 375,175 415,165 455,155 495,148 515,145" fill="none" stroke="#275b96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="95" cy="290" r="4" fill="#275b96"/>
  <circle cx="175" cy="260" r="4" fill="#275b96"/>
  <circle cx="255" cy="220" r="4" fill="#275b96"/>
  <circle cx="335" cy="190" r="4" fill="#275b96"/>
  <circle cx="415" cy="165" r="4" fill="#275b96"/>
  <circle cx="515" cy="145" r="5" fill="#E36925" stroke="white" stroke-width="2"/>
  <!-- Current value callout -->
  <rect x="470" y="115" width="60" height="24" rx="6" fill="#E36925"/>
  <text x="500" y="131" font-family="Inter, system-ui, sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">94.4%</text>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#275b96" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#275b96" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Stats bar -->
  <rect x="50" y="385" width="150" height="45" rx="8" fill="#f0f9ff"/>
  <text x="65" y="405" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Total Predictions</text>
  <text x="65" y="421" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#275b96" font-weight="700">12,847</text>
  <rect x="225" y="385" width="150" height="45" rx="8" fill="#f0fdf4"/>
  <text x="240" y="405" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Win Rate</text>
  <text x="240" y="421" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#22c55e" font-weight="700">87.3%</text>
  <rect x="400" y="385" width="150" height="45" rx="8" fill="#fff7ed"/>
  <text x="415" y="405" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Avg Edge</text>
  <text x="415" y="421" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#E36925" font-weight="700">+18.2%</text>
</svg>